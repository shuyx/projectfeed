name = "projectfeed"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
# v1.16.3: let Worker run first so app.all('*') can override Cache-Control headers
# (without this, CF Assets returns static files before Worker code runs)
run_worker_first = true

[vars]
# DeepSeek API（Key 通过 wrangler secret put DEEPSEEK_API_KEY 设置）
DEEPSEEK_BASE_URL = "https://api.deepseek.com/chat/completions"
DEEPSEEK_MODEL = "deepseek-v4-flash"

[[d1_databases]]
binding = "DB"
database_name = "projectfeed-db"
database_id = "d9120ae1-eba8-4a24-a1ed-16b0bb17a2ed"
migrations_dir = "migrations"
